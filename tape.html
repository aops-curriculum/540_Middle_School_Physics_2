<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="eigennode-aspect" content="3/2">
<title>Top Tape and Bottom Tape</title>
<link rel="stylesheet" href="shared/sim.css">
</head>
<body>

<p id="hint">Tear off a pair of strips: they were stuck together on the desk, T on top and B on the bottom, and pulled apart. Drag them near each other, and near a flyer, to see what they do.</p>

<div id="cwrap"><div id="stage"><canvas id="canvas"></canvas></div></div>

<div id="controls">
  <div class="row">
    <button id="peel">Tear off a new pair (T and B)</button>
    <button id="flyer">Add a flyer</button>
    <button id="reset">Start over</button>
  </div>
  <div class="row"><span class="note">Tape is plastic, so charge stays where it lands. Nothing flows when two strips touch.</span></div>
</div>

<script src="shared/charges.js"></script>
<script>
(function () {
  var CS = window.ChargeSim;
  var W = 900, H = 600;
  var canvas = document.getElementById('canvas');
  var world = new CS.World({ W: W, H: H, bounds: { x0: 30, y0: 30, x1: W - 30, y1: H - 30 } });

  // Peeling the strips apart moves charge from one to the other, so they come
  // off with equal and opposite charge. Top comes off positive.
  var TAPE_Q = 2.4;
  var pairCount = 0;

  // Tape and flyer are both insulators here: nothing is exchanged on contact.
  world.onContact = function () { return true; };

  function addPair() {
    pairCount++;
    // Well separated, so a fresh pair drifts together slowly instead of
    // snapping shut before anyone can look at it.
    var y = 130 + ((pairCount - 1) % 3) * 170;
    world.add({ id: 'T' + pairCount, kind: 'tape', x: 150, y: y, r: 34,
                q: TAPE_Q, conductor: false, label: 'T', data: { tint: '#3466c4' } });
    world.add({ id: 'B' + pairCount, kind: 'tape', x: 560, y: y, r: 34,
                q: -TAPE_Q, conductor: false, label: 'B', data: { tint: '#d94141' } });
  }

  function addFlyer() {
    world.add({ id: 'fl' + (world.bodies.length), kind: 'flyer',
                x: 790, y: 110 + (world.bodies.length % 4) * 120, r: 28, q: 0, conductor: false });
  }

  function build() {
    world.bodies.length = 0;
    pairCount = 0;
    addPair();
    addFlyer();
  }

  var m = CS.mountCanvas(canvas, W, H, draw);

  function pick(x, y) {
    for (var i = world.bodies.length - 1; i >= 0; i--) {
      var b = world.bodies[i];
      var dx = x - b.x, dy = y - b.y;
      if (dx * dx + dy * dy < (b.r + 8) * (b.r + 8)) return b;
    }
    return null;
  }
  CS.makeDragger(canvas, m.toLogical, pick, {
    onPick: function () { canvas.classList.add('grabbing'); },
    onDrop: function () { canvas.classList.remove('grabbing'); }
  });

  function drawTape(ctx, b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    var w = 26, h = 74;
    // strip
    ctx.fillStyle = 'rgba(232,240,248,0.92)';
    ctx.strokeStyle = '#93a3b3';
    ctx.lineWidth = 1.4;
    CS.roundRect(ctx, -w / 2, -h / 2, w, h, 3);
    ctx.fill(); ctx.stroke();
    // folded-over handle at the bottom
    ctx.fillStyle = '#cfdae5';
    CS.roundRect(ctx, -w / 2, h / 2 - 14, w, 14, 3);
    ctx.fill(); ctx.stroke();
    // label
    ctx.fillStyle = b.data.tint;
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.label, 0, -h / 2 + 18);
    ctx.restore();
  }

  function draw() {
    var ctx = m.ctx;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

    // desk edge, for a sense of place
    ctx.strokeStyle = '#e3e9ef'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, H - 26); ctx.lineTo(W, H - 26); ctx.stroke();
    ctx.fillStyle = '#aeb8c2'; ctx.font = '12px Arial'; ctx.textAlign = 'left';
    ctx.fillText('desk', 12, H - 10);

    for (var i = 0; i < world.bodies.length; i++) {
      var b = world.bodies[i];
      if (b.kind === 'tape') drawTape(ctx, b);
      else CS.drawFlyer(ctx, b, 0);
    }
  }

  function frame() { world.step(); draw(); requestAnimationFrame(frame); }
  window.scene = { world: world, build: build, draw: draw };  // for console checks

  document.getElementById('peel').addEventListener('click', function () {
    if (pairCount < 3) addPair();
  });
  document.getElementById('flyer').addEventListener('click', addFlyer);
  document.getElementById('reset').addEventListener('click', build);

  build();
  frame();
})();
</script>
</body>
</html>
