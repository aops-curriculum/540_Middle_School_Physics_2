<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cavendish experiment</title>
<style>
  /* ---- Color palette (light mode) ---- */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #000000;
    --muted: #666666;
    --orbit: #000000;
    --arrow: #0000ee;
    --scope-bg: #f4f2e8;
    --scope-rim: #333333;
    --track: #c8c8c8;
    --button-bg: #eeeeee;
  }
  /* ---- Same palette, dark mode ---- */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1d1f22;
      --ink: #f2f2f2;
      --muted: #a8a8a8;
      --orbit: #d0d0d0;
      --arrow: #6fa8ff;
      --scope-bg: #2c2b26;
      --scope-rim: #bdbdbd;
      --track: #555555;
      --button-bg: #33363a;
    }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; }
  canvas { display: block; outline: none; touch-action: none; }
  canvas:focus-visible { outline: 2px solid var(--arrow); outline-offset: -2px; }
</style>
</head>
<body>
<canvas id="sim" tabindex="0"
  aria-label="Cavendish torsion balance. Use the up and down arrow keys to change the small mass m. Press R to restart."></canvas>
<script>
// =====================================================================
// 1. CANVAS SETUP
// =====================================================================
const W = 500, H = 300;
const cv = document.getElementById('sim');
const ctx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;          // sharp drawing on high-res screens
cv.width = W * dpr; cv.height = H * dpr;
cv.style.width = W + 'px'; cv.style.height = H + 'px';
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
const FONT = 'Arial, Helvetica, sans-serif';

// Colors are read from the CSS variables so light/dark mode both work.
const C = {};
function readColors() {
  const s = getComputedStyle(document.documentElement);
  for (const k of ['ink', 'muted', 'orbit', 'arrow', 'scope-bg', 'scope-rim', 'track', 'button-bg']) {
    C[k] = s.getPropertyValue('--' + k).trim();
  }
}
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// =====================================================================
// 2. PHYSICS CONSTANTS (SI units)
// =====================================================================
const G = 6.674e-11;     // gravitational constant, N m^2 / kg^2
const M = 158;           // large lead sphere, kg (Cavendish's value)
const R = 0.93;          // half the arm length, m (arm = 1.86 m)
const R0 = 0.230;        // m-to-M center distance when the wire is untwisted, m
const M_REF = 0.73;      // Cavendish's small mass, kg
const T_REF = 420;       // his oscillation period, s (7 min)
// Wire stiffness chosen so that m = 0.73 kg gives a 7-minute period:
//   T = 2*pi*sqrt(I/kappa)  ->  kappa = 4*pi^2*I / T^2
const KAPPA = 4 * Math.PI ** 2 * (2 * M_REF * R * R) / T_REF ** 2;   // N m / rad
const ZETA = 0.25;       // damping ratio (air drag on the arm); 0 = no damping, 1 = critical
const DELTA0 = 2 * Math.asin(R0 / (2 * R));  // angle between m and M (seen from wire) at zero twist

// Display settings
const TIME_SCALE = 200;  // 1 real second = 200 simulated seconds
const VIS_GAIN = 40;     // twist drawn 40x larger than reality in the main view
const M_MIN = 0.1, M_MAX = 2.0;

// =====================================================================
// 3. STATE: the only things that change over time
// =====================================================================
let m = M_REF;    // small mass, kg (set by the slider)
let theta = 0;    // twist angle of the wire, rad (positive = toward the big spheres)
let omega = 0;    // angular velocity, rad/s
let thetaEq = 0;  // equilibrium twist for the current m (computed below)

// ---- Physics helper functions ----
// Separation r between the centers of m and M when the wire is twisted by th.
// Both spheres sit on a circle of radius R; they are separated by angle (DELTA0 - th),
// so the straight-line (chord) distance is 2 R sin(angle / 2).
function sep(th)    { return 2 * R * Math.sin((DELTA0 - th) / 2); }
function force(th)  { const r = sep(th); return G * M * m / (r * r); }   // Newton's law of gravitation
// Torque on the arm from BOTH pairs of spheres. Only the part of F perpendicular
// to the arm makes it turn; that part is F cos(angle/2).
function torque(th) { return 2 * force(th) * R * Math.cos((DELTA0 - th) / 2); }
function inertia()  { return 2 * m * R * R; }                         // two point masses at distance R
function period()   { return 2 * Math.PI * Math.sqrt(inertia() / KAPPA); }
function dampingB() { return 2 * ZETA * Math.sqrt(KAPPA * inertia()); }

// Equilibrium: gravitational torque = wire torque, i.e. torque(th) = KAPPA*th.
// Because torque(th) barely changes with th, simply repeating th = torque(th)/KAPPA converges fast.
function solveEq() {
  let th = 0;
  for (let i = 0; i < 30; i++) th = torque(th) / KAPPA;
  return th;
}

// Advance the physics by dtSim seconds of simulated time.
// Equation of motion:  I * alpha = torque_gravity - KAPPA*theta - b*omega
function step(dtSim) {
  const n = Math.ceil(dtSim / 1.0);      // small sub-steps of at most 1 s
  const h = dtSim / n;
  const I = inertia(), b = dampingB();
  for (let i = 0; i < n; i++) {
    const alpha = (torque(theta) - KAPPA * theta - b * omega) / I;
    omega += alpha * h;                  // update velocity first...
    theta += omega * h;                  // ...then position (semi-implicit Euler: stable)
  }
}

function isSettled() {
  const wn = 2 * Math.PI / period();
  const tol = 0.01 * thetaEq;            // within 1% of the final twist
  return Math.abs(theta - thetaEq) < tol && Math.abs(omega) / wn < tol;
}

function setMass(newM) {
  m = Math.min(M_MAX, Math.max(M_MIN, Math.round(newM * 100) / 100));
  thetaEq = solveEq();
  if (reducedMotion) { theta = thetaEq; omega = 0; }
}
function restart() {
  theta = 0; omega = 0;
  if (reducedMotion) theta = thetaEq;
}
setMass(M_REF);
restart();

// =====================================================================
// 4. LAYOUT (pixel positions)
// =====================================================================
const CX = 150, CY = 160;          // where the wire meets the arm
const EA = 130, EB = 48;           // ellipse half-width and half-height (oblique view)
const VIS_HALF = 15 * Math.PI / 180;               // drawn half-gap between m and M at zero twist
const PHI_SMALL0 = -Math.PI / 2 - VIS_HALF;        // upper m at zero twist
const PHI_BIG = -Math.PI / 2 + VIS_HALF;           // upper M (fixed)
const RAD_BIG = 22;                                // big sphere radius, px
const SCOPE = { x: 372, y: 82, r: 56 };            // telescope inset
const SLIDER = { x: 478, top: 40, bot: 258 };      // vertical slider track
const BTN = { x: 8, y: 270, w: 64, h: 22 };        // restart button
const F_MAX = G * M * M_MAX / (R0 * R0) * 1.05;    // for scaling arrow length

// A point on the circle at angle phi, as seen in the oblique (tilted) view.
function proj(phi) { return { x: CX + EA * Math.cos(phi), y: CY + EB * Math.sin(phi) }; }

// =====================================================================
// 5. DRAWING HELPERS
// =====================================================================
function drawSphere(p, rad, fill, label, fontPx) {
  ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 2 * Math.PI);
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = '#000'; ctx.stroke();
  // white highlight streak (like the reference diagram)
  ctx.beginPath(); ctx.arc(p.x, p.y, rad * 0.72, 1.12 * Math.PI, 1.38 * Math.PI);
  ctx.lineWidth = Math.max(1.5, rad * 0.16); ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.stroke();
  if (label) drawSphereLabel(p, label, fontPx);
}
function drawSphereLabel(p, label, fontPx) {
  ctx.fillStyle = '#000'; ctx.font = `italic ${fontPx}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, p.x, p.y + 1);
}

function arrow(x1, y1, x2, y2, color) {
  const ang = Math.atan2(y2 - y1, x2 - x1), hl = 7;
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.moveTo(x2 - hl * Math.cos(ang - 0.45), y2 - hl * Math.sin(ang - 0.45));
  ctx.lineTo(x2, y2);
  ctx.lineTo(x2 - hl * Math.cos(ang + 0.45), y2 - hl * Math.sin(ang + 0.45));
  ctx.stroke();
}

// Write  "sym = rest"  with sym in italics; returns the x where the text ended.
function drawVar(x, y, sym, rest, px) {
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = C.ink;
  ctx.font = `italic ${px}px ${FONT}`; ctx.fillText(sym, x, y);
  x += ctx.measureText(sym).width;
  ctx.font = `${px}px ${FONT}`; ctx.fillText(rest, x, y);
  return x + ctx.measureText(rest).width;
}
// Write a number in scientific notation, e.g. 1.46 × 10^-7, with a raised exponent.
function drawSci(x, y, value, unit, px) {
  const e = Math.floor(Math.log10(value));
  const mant = value / 10 ** e;
  ctx.font = `${px}px ${FONT}`; ctx.fillStyle = C.ink; ctx.textAlign = 'left';
  const base = mant.toFixed(2) + ' \u00d7 10';
  ctx.fillText(base, x, y); x += ctx.measureText(base).width;
  ctx.font = `${Math.round(px * 0.72)}px ${FONT}`;
  const ex = (e < 0 ? '\u2212' : '') + Math.abs(e);
  ctx.fillText(ex, x + 1, y - px * 0.42); x += ctx.measureText(ex).width + 2;
  ctx.font = `${px}px ${FONT}`; ctx.fillText(' ' + unit, x, y);
}

// =====================================================================
// 6. MAIN DRAWING
// =====================================================================
function drawApparatus() {
  const phi = PHI_SMALL0 + VIS_GAIN * theta;     // exaggerated arm angle
  const mUp = proj(phi), mLo = proj(phi + Math.PI);
  const MUp = proj(PHI_BIG), MLo = proj(PHI_BIG + Math.PI);
  const radSmall = 12 * Math.cbrt(m / M_REF);     // size grows with mass (same density)
  const fontSmall = Math.max(9, Math.round(radSmall * 1.35));

  // dashed orbit of the small spheres
  ctx.setLineDash([5, 5]); ctx.lineWidth = 1; ctx.strokeStyle = C.orbit;
  ctx.beginPath(); ctx.ellipse(CX, CY, EA, EB, 0, 0, 2 * Math.PI); ctx.stroke();
  ctx.setLineDash([]);

  // back big sphere
  drawSphere(MUp, RAD_BIG, '#a3a2a5', 'M', 24);

  // torsion wire, then arm
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(CX, 0); ctx.lineTo(CX, CY); ctx.stroke();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(mUp.x, mUp.y); ctx.lineTo(mLo.x, mLo.y); ctx.stroke();

  // back small sphere drawn after the arm, so it (and its label) covers the rod's end
  drawSphere(mUp, radSmall, '#ee0000', 'm', fontSmall);

  // front (lower) spheres
  drawSphere(MLo, RAD_BIG, '#a3a2a5', 'M', 24);
  drawSphere(mLo, radSmall, '#ee0000', 'm', fontSmall);

  // force arrows: they arrive at each m from the outside, pointing toward its M
  const F = force(theta);
  const len = 8 + 30 * (F / F_MAX);
  const pairs = [[mUp, MUp, -14], [mLo, MLo, 20]];
  for (const [s, B, labelDy] of pairs) {
    const dx = B.x - s.x, dy = B.y - s.y, d = Math.hypot(dx, dy);
    const ux = dx / d, uy = dy / d;
    const tipX = s.x - ux * (radSmall + 2), tipY = s.y - uy * (radSmall + 2);
    const tailX = tipX - ux * len, tailY = tipY - uy * len;
    arrow(tailX, tailY, tipX, tipY, C.arrow);
    ctx.fillStyle = C.ink; ctx.font = `italic 18px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('F', tailX - ux * 4, tailY + labelDy);
  }

  // "Torsion wire" label
  ctx.fillStyle = C.ink; ctx.font = `16px ${FONT}`;
  ctx.textAlign = 'right'; ctx.fillText('Torsion wire', CX - 8, 26);

  // r dimension under the front pair
  const x1 = Math.min(MLo.x, mLo.x), x2 = Math.max(MLo.x, mLo.x), xm = (x1 + x2) / 2, yb = 251;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.moveTo(x1, 238); ctx.lineTo(x1, 264); ctx.moveTo(x2, 238); ctx.lineTo(x2, 264);
  ctx.moveTo(x1, yb); ctx.lineTo(xm - 10, yb); ctx.moveTo(xm + 10, yb); ctx.lineTo(x2, yb);
  ctx.stroke();
  ctx.fillStyle = C.ink; ctx.font = `italic 18px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('r', xm, yb);
  ctx.textBaseline = 'alphabetic';
}

function drawScope() {
  const { x, y, r } = SCOPE;
  const PX_PER_MM = 17, CENTER_MM = 2;           // view shows about -1 mm to +5 mm
  const toX = mm => x + (mm - CENTER_MM) * PX_PER_MM;

  ctx.fillStyle = C.muted; ctx.font = `12px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillText('Telescope view', x, 18);

  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.clip();
  ctx.fillStyle = C['scope-bg']; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);

  // fixed scale: minor ticks every 0.25 mm, numbered ticks every 1 mm
  ctx.strokeStyle = C.ink; ctx.fillStyle = C.ink; ctx.lineWidth = 1;
  ctx.font = `11px ${FONT}`; ctx.textAlign = 'center';
  for (let k = -8; k <= 28; k++) {
    const mm = k / 4, tx = toX(mm);
    const major = k % 4 === 0;
    ctx.beginPath(); ctx.moveTo(tx, y - 12); ctx.lineTo(tx, y - 12 + (major ? 16 : 8)); ctx.stroke();
    if (major && Math.abs(tx - x) < r - 12) ctx.fillText(String(mm).replace('-', '\u2212'), tx, y + 18);
  }
  ctx.beginPath(); ctx.moveTo(x - r, y - 12); ctx.lineTo(x + r, y - 12); ctx.stroke();

  // moving index mark on the arm: the TRUE shift R*theta (not exaggerated)
  const shiftMM = R * theta * 1000;
  const px = toX(shiftMM);
  ctx.strokeStyle = '#ee0000'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px, y - 44); ctx.lineTo(px, y - 14); ctx.stroke();
  ctx.fillStyle = '#ee0000';
  ctx.beginPath(); ctx.moveTo(px, y - 12); ctx.lineTo(px - 5, y - 20); ctx.lineTo(px + 5, y - 20); ctx.fill();
  ctx.restore();

  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
  ctx.lineWidth = 3; ctx.strokeStyle = C['scope-rim']; ctx.stroke();
}

function drawReadouts() {
  const x = 312;
  drawVar(x, 182, 'm', ' = ' + m.toFixed(2) + ' kg', 14);
  drawVar(x, 202, 'r', ' = ' + sep(theta).toFixed(5) + ' m', 14);
  const xe = drawVar(x, 222, 'F', ' = ', 14);
  drawSci(xe, 222, force(theta), 'N', 14);
  drawVar(x, 242, 'T', ' = ' + (period() / 60).toFixed(1) + ' min', 14);

  ctx.font = `12px ${FONT}`; ctx.textAlign = 'left';
  ctx.fillStyle = isSettled() ? C.ink : C.muted;
  ctx.fillText(isSettled() ? 'Settled' : 'Settling\u2026', x, 262);
  ctx.fillStyle = C.muted; ctx.font = `11px ${FONT}`;
  ctx.fillText('Twist drawn \u00d7' + VIS_GAIN + ', time \u00d7' + TIME_SCALE, x, 280);
}

function mToY(mass) { return SLIDER.bot - (mass - M_MIN) / (M_MAX - M_MIN) * (SLIDER.bot - SLIDER.top); }
function yToM(y)    { return M_MIN + (SLIDER.bot - y) / (SLIDER.bot - SLIDER.top) * (M_MAX - M_MIN); }

function drawSlider() {
  const { x, top, bot } = SLIDER, hy = mToY(m);
  ctx.fillStyle = C.ink; ctx.font = `italic 16px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillText('m', x, 26);
  ctx.fillStyle = C.muted; ctx.font = `11px ${FONT}`;
  ctx.fillText('(kg)', x, 282);
  ctx.lineCap = 'round'; ctx.lineWidth = 4;
  ctx.strokeStyle = C.track; ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bot); ctx.stroke();
  ctx.strokeStyle = '#ee0000'; ctx.beginPath(); ctx.moveTo(x, hy); ctx.lineTo(x, bot); ctx.stroke();
  // tick labels
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.muted;
  for (const v of [0.1, 0.5, 1, 1.5, 2]) ctx.fillText(String(v), x - 10, mToY(v));
  ctx.textBaseline = 'alphabetic';
  // handle
  ctx.beginPath(); ctx.arc(x, hy, 8, 0, 2 * Math.PI);
  ctx.fillStyle = '#ee0000'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#000'; ctx.stroke();
}

function drawButton() {
  const { x, y, w, h } = BTN;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 4);
  ctx.fillStyle = C['button-bg']; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = C.muted; ctx.stroke();
  ctx.fillStyle = C.ink; ctx.font = `12px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Restart', x + w / 2, y + h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawApparatus();
  drawScope();
  drawReadouts();
  drawSlider();
  drawButton();
}

// =====================================================================
// 7. INPUT: slider dragging, restart button, keyboard
// =====================================================================
let dragging = false;
function canvasPos(e) {
  const b = cv.getBoundingClientRect();
  return { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height };
}
const onSlider = p => p.x > SLIDER.x - 22 && p.x < W && p.y > SLIDER.top - 14 && p.y < SLIDER.bot + 14;
const onButton = p => p.x > BTN.x && p.x < BTN.x + BTN.w && p.y > BTN.y && p.y < BTN.y + BTN.h;

cv.addEventListener('pointerdown', e => {
  const p = canvasPos(e);
  if (onSlider(p)) { dragging = true; cv.setPointerCapture(e.pointerId); setMass(yToM(p.y)); }
  else if (onButton(p)) restart();
});
cv.addEventListener('pointermove', e => {
  const p = canvasPos(e);
  if (dragging) setMass(yToM(p.y));
  cv.style.cursor = (dragging || onSlider(p) || onButton(p)) ? 'pointer' : 'default';
});
cv.addEventListener('pointerup', () => { dragging = false; });
cv.addEventListener('pointercancel', () => { dragging = false; });
cv.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowUp' || k === 'ArrowRight') setMass(m + 0.01);
  else if (k === 'ArrowDown' || k === 'ArrowLeft') setMass(m - 0.01);
  else if (k === 'PageUp') setMass(m + 0.1);
  else if (k === 'PageDown') setMass(m - 0.1);
  else if (k === 'r' || k === 'R') restart();
  else return;
  e.preventDefault();
});

// =====================================================================
// 8. ANIMATION LOOP
// =====================================================================
let last = performance.now();
function loop(now) {
  const dtReal = Math.min(0.05, (now - last) / 1000);  // cap so a hidden tab doesn't jump
  last = now;
  step(dtReal * TIME_SCALE);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
