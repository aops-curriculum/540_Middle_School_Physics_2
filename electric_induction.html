<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="eigennode-aspect" content="3/2">
<title>Positive and Negative Charge Inside Everything</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #ffffff;
    font-family: Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
(function () {
'use strict';

/* ─── which picture of charge this file draws ────────────────── */
/* 'none' is the bare apparatus, 'one' the single red charge stuff that
   flows from object to object, 'two' the red and blue charge that sit
   inside everything. Everything below this line is the same in
   fly_stick.html, flowing_essence.html and electric_induction.html, so
   a diff between the three shows only the title and this constant. */
const DEFAULT_MODEL = 'two';

/* ─── query params ─────────────────────────────────────────────── */
const Q    = new URLSearchParams(location.search);
const num  = (k, d) => Q.has(k) && isFinite(+Q.get(k)) ? +Q.get(k) : d;
const bool = (k, d) => Q.has(k) ? Q.get(k) !== '0' : d;

const clampi = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v)));

const MODEL = (() => {
  const m = Q.get('model') || DEFAULT_MODEL;
  return (m === 'one' || m === 'two') ? m : 'none';
})();
window.SIM_DEFAULT_MODEL = DEFAULT_MODEL;   /* the cheat panel reads this */

const CFG = {
  power:    bool('power',  false),
  charges:  bool('charges', MODEL !== 'none'),
  nflyers:  clampi(num('flyers', 2), 0, 3),
  npapers:  clampi(num('papers', 6), 0, 14),
  /* the metal spoon grounds the stick; the plastic ruler insulates it.
     the old hand/glove names still work so older links keep running. */
  hand:     bool('spoon', bool('hand',  true)),
  glove:    bool('ruler', bool('glove', true)),
  labels:   bool('labels', true),
  sparks:   bool('sparks', true),
  resetbtn: bool('resetbtn', true),
  gravity:  Math.max(0.05, num('gravity', 1)),
  strength: Math.max(0.05, num('strength', 1)),
  collapse: bool('collapse', true)
};

/* ─── canvas ───────────────────────────────────────────────────── */
const DESIGN_W = 900, DESIGN_H = 600;
const W = DESIGN_W, H = DESIGN_H;
const FLOOR = 520;
const RESET_X = 856, RESET_Y = 558, RESET_R = 16;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  if (!cw || !ch) return;
  canvas.width  = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  ctx.setTransform(canvas.width / DESIGN_W, 0, 0, canvas.height / DESIGN_H, 0, 0);
  draw();
}

/* ─── the wand, measured down from its charging tip ────────────── */
const HW       = 9;     /* half-width of the tube */
const PALE_END = 64;    /* pale printed section with the logo */
const GUARD_0  = 92, GUARD_1 = 118;
const BTN_Y    = 128;   /* red power button */
const OR1_0    = 136, OR1_1 = 144;
const TEAL_1   = 200;
const OR2_1    = 208;
const CAP_0    = 204, CAP_1 = 240, CAP_HW = 11.5;
const WAND_LEN = 240;

/* how far down the tip may be dragged, and where the button may sit */
const STICK_Y_MAX = FLOOR + 10;
const BTN_Y_MAX   = H - 22;

/* ─── the spoon and the ruler, in their own local coordinates ──── */
const SPOON_BY = -34, SPOON_RX = 15, SPOON_RY = 23;  /* bowl */
const SPOON_TIP = SPOON_BY - SPOON_RY + 2;           /* the end that touches */
const RULER_L = 168, RULER_W = 34;

/* ─── physics constants ────────────────────────────────────────── */
const G    = 700 * CFG.gravity;
const KREP = 8.5e6 * CFG.strength;   // like charges push apart
const KATT = 6.0e6 * CFG.strength;   // charged stick pulls a neutral flyer
const KPAP = 4.8e6 * CFG.strength;   // charged stick pulls paper

/* ─── state ────────────────────────────────────────────────────── */
let stick, flyers, papers, hand, glove, sparks, flows, hover, drag, prev;

function reset() {
  stick = { x: 200, y: 268, on: CFG.power, crackle: 0 };
  flyers = [];
  const fx = [400, 520, 645];
  for (let i = 0; i < CFG.nflyers; i++)
    flyers.push({ x: fx[i], y: FLOOR - 30, vx: 0, vy: 0, q: 0, r: 30,
                  rot: i * 0.5 - 0.25, held: false, seed: 7 + i * 31,
                  open: CFG.collapse ? 0 : 1 });
  papers = [];
  for (let i = 0; i < CFG.npapers; i++)
    papers.push({ x: 600 + i * 26, y: FLOOR - 5, vx: 0, vy: 0, seed: 13 + i * 19,
                  rot: (i * 1.7) % 1.4 - 0.7, stuck: null, held: false });
  hand  = { x: 835, y: 330 };          /* the spoon */
  glove = { x: 782, y: 462, worn: false };  /* the plastic ruler */
  sparks = []; flows = [];
  drag = null; hover = null;
}

/* ─── helpers ──────────────────────────────────────────────────── */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* the red button rides on the wand, but never leaves the screen */
function btnPos() {
  return { x: stick.x, y: Math.min(stick.y + BTN_Y, BTN_Y_MAX) };
}

/* A run of charge from one place to another, drawn as red stuff on the
   move. Only the sims that draw a charge picture use it. */
function addFlow(x0, y0, x1, y1, n) {
  if (MODEL === 'none') return;
  const d = Math.hypot(x1 - x0, y1 - y0) || 1;
  for (let i = 0; i < (n || 1); i++) {
    const bow = (Math.random() - 0.5) * 26;
    flows.push({ x0: x0, y0: y0, x1: x1, y1: y1,
                 t: -i * 0.05, dur: 0.32 + Math.random() * 0.14,
                 ax: -(y1 - y0) / d * bow, ay: (x1 - x0) / d * bow });
  }
}

function addSpark(x, y, n) {
  if (!CFG.sparks) return;
  const segs = [];
  for (let i = 0; i < (n || 3); i++) {
    const a = Math.random() * Math.PI * 2, len = 10 + Math.random() * 16;
    const pts = [[0, 0]];
    let cx = 0, cy = 0;
    for (let k = 0; k < 3; k++) {
      cx += Math.cos(a) * len / 3 + (Math.random() - 0.5) * 7;
      cy += Math.sin(a) * len / 3 + (Math.random() - 0.5) * 7;
      pts.push([cx, cy]);
    }
    segs.push(pts);
  }
  sparks.push({ x: x, y: y, segs: segs, life: 0.22, t: 0.22 });
}

/* the bare spoon lets charge run away to ground; resting on the
   plastic ruler, it does not */
function handTouch() {
  if (!CFG.hand || glove.worn) return null;
  return { x: hand.x, y: hand.y + SPOON_TIP };
}

/* the whole wand is live, so the spoon anywhere along it drains the charge */
function handOnWand() {
  const ht = handTouch();
  if (!ht) return null;
  const dx = ht.x - stick.x, dy = ht.y - stick.y;
  if (dx < -34 || dx > 34) return null;
  if (dy < -34 || dy > WAND_LEN + 16) return null;
  return ht;
}

function stickCharge() {
  if (!stick.on) return 0;
  return handOnWand() ? 0 : 1;
}

/* ─── physics ──────────────────────────────────────────────────── */
let drainCd = 0;

function step(dt) {
  const sq = stickCharge();
  const ht = handTouch();
  const onWand = handOnWand();
  drainCd = Math.max(0, drainCd - dt);

  if (glove.worn) { glove.x = hand.x; glove.y = hand.y; }

  /* spoon shorting out the stick */
  if (stick.on && sq === 0 && onWand && drainCd === 0) {
    addSpark(onWand.x, onWand.y, 3); drainCd = 0.28;
    addFlow(onWand.x, onWand.y, hand.x, hand.y + 58, 3);
  }

  /* crackle at the tip while the stick is charged */
  if (sq > 0) {
    stick.crackle -= dt;
    if (stick.crackle <= 0) {
      stick.crackle = 0.25 + Math.random() * 0.35;
      addSpark(stick.x + (Math.random() - 0.5) * 16, stick.y + (Math.random() - 0.5) * 12, 1);
    }
  }

  /* ── flyers ── */
  for (const f of flyers) {
    /* charged: the loop springs open. uncharged: it sags flat again. */
    if (CFG.collapse) {
      const tgt = f.q > 0.3 ? 1 : 0;
      const rate = tgt > f.open ? 12 : 4.5;
      f.open += (tgt - f.open) * Math.min(1, rate * dt);
      if (Math.abs(tgt - f.open) < 0.004) f.open = tgt;
    } else f.open = 1;

    const dx = f.x - stick.x, dy = f.y - stick.y;
    let r = Math.hypot(dx, dy) || 1;

    /* the bare spoon drains a charged flyer */
    if (ht && f.q > 0.02 && Math.hypot(ht.x - f.x, ht.y - f.y) < f.r * 0.85 + 12) {
      f.q = 0; addSpark(ht.x, ht.y, 3);
      addFlow(f.x, f.y, hand.x, hand.y + 58, 4);
    }

    /* touching the charged tip loads the flyer up with the same charge */
    if (sq > 0 && r < 34 && f.q < 1) {
      f.q = Math.min(1, f.q + dt / 0.35);
      if (!f.held) {
        f.x += (stick.x - f.x) * 0.35;
        f.y += (stick.y - 10 - f.y) * 0.35;
        f.vx = 0; f.vy = f.q >= 1 ? -50 : 0;
      }
      if (f.q < 1 && Math.random() < dt * 8) addSpark(stick.x, stick.y, 1);
      if (f.q < 1 && Math.random() < dt * 16) addFlow(stick.x, stick.y, f.x, f.y, 1);
      if (!f.held) continue;
    }
    if (f.held) continue;

    let ax = 0, ay = G;
    if (sq > 0) {
      if (f.q > 0.02) {
        const a = Math.min(6000, KREP * f.q * sq / (r * r));
        ax += a * dx / r * 0.35;          /* mostly lifts, drifts slowly sideways */
        ay += a * dy / r;
      } else if (r < 175) {
        const a = Math.min(2600, KATT * sq / (r * r));
        ax -= a * dx / r; ay -= a * dy / r;
      }
    }
    ax -= f.vx * 2.6; ay -= f.vy * 1.8;
    ax += (Math.random() - 0.5) * 110;

    f.vx += ax * dt; f.vy += ay * dt;
    f.x += f.vx * dt; f.y += f.vy * dt;

    const rest = FLOOR - f.r;
    if (f.y > rest) { f.y = rest; f.vy *= -0.15; f.vx *= 0.75; }
    if (f.y < f.r + 6) { f.y = f.r + 6; f.vy = Math.max(0, f.vy); }
    if (f.x < f.r) { f.x = f.r; f.vx *= -0.4; }
    if (f.x > W - f.r) { f.x = W - f.r; f.vx *= -0.4; }
    f.rot += f.vx * 0.0015 * dt * 60 + (f.y < rest - 4 ? dt * 0.35 : 0);
  }

  /* ── bits of paper ── */
  for (const p of papers) {
    if (p.held) continue;
    if (p.stuck) {
      const t = p.stuck.t;
      const tq = (t === stick) ? sq : t.q;
      if (tq <= 0.05) { p.stuck = null; }
      else { p.x = t.x + p.stuck.ox; p.y = t.y + p.stuck.oy; p.vx = 0; p.vy = 0; continue; }
    }
    const cands = [];
    if (sq > 0) cands.push({ o: stick, q: sq, k: KPAP });
    for (const f of flyers) if (f.q > 0.05) cands.push({ o: f, q: f.q, k: KPAP * 0.5 });

    let ax = 0, ay = G, best = null, bestA = 0;
    for (const c of cands) {
      const dx = c.o.x - p.x, dy = c.o.y - p.y, r = Math.hypot(dx, dy) || 1;
      if (r > 175) continue;
      const a = Math.min(3200, c.k * c.q / (r * r));
      ax += a * dx / r; ay += a * dy / r;
      if (r < 26 && a > bestA) { best = c.o; bestA = a; }
    }
    if (best) {
      p.stuck = { t: best, ox: p.x - best.x, oy: p.y - best.y };
      p.vx = 0; p.vy = 0; continue;
    }
    ax -= p.vx * 2.2; ay -= p.vy * 1.6;
    p.vx += ax * dt; p.vy += ay * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vx * 0.004 * dt * 60;

    const rest = FLOOR - 5;
    if (p.y > rest) { p.y = rest; p.vy *= -0.2; p.vx *= 0.7; }
    if (p.y < 8) { p.y = 8; p.vy = Math.max(0, p.vy); }
    if (p.x < 12) { p.x = 12; p.vx *= -0.4; }
    if (p.x > W - 12) { p.x = W - 12; p.vx *= -0.4; }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    sparks[i].life -= dt;
    if (sparks[i].life <= 0) sparks.splice(i, 1);
  }
  for (let i = flows.length - 1; i >= 0; i--) {
    flows[i].t += dt;
    if (flows[i].t >= flows[i].dur) flows.splice(i, 1);
  }
}

/* ─── drawing ──────────────────────────────────────────────────── */
/* ─── the picture of charge, drawn on the apparatus ──────────── */
/* Red is the charge that moves: the one stuff in the one-fluid picture,
   the negative charge in the two-fluid one. Blue is positive charge,
   which stays put. */
const RED = '#d94141', BLUE = '#3466c4';

function essence(x, y, r, alpha) {
  const a = alpha == null ? 1 : alpha;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0.00, 'rgba(217,65,65,' + (0.88 * a).toFixed(3) + ')');
  g.addColorStop(0.55, 'rgba(217,65,65,' + (0.52 * a).toFixed(3) + ')');
  g.addColorStop(1.00, 'rgba(217,65,65,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}

function sign(x, y, positive, s) {
  ctx.beginPath(); ctx.arc(x, y, s, 0, 7);
  ctx.fillStyle = positive ? BLUE : RED; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = Math.max(1.2, s * 0.36); ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.moveTo(x - s * 0.52, y); ctx.lineTo(x + s * 0.52, y);
  if (positive) { ctx.moveTo(x, y - s * 0.52); ctx.lineTo(x, y + s * 0.52); }
  ctx.stroke();
}

/* a fixed scatter per object, so the marks sit still instead of crawling
   around from one frame to the next */
function scatter(n, seed) {
  const pts = [];
  let s = seed || 1;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd());
    pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
  }
  return pts;
}

/* Which way the charge inside an object gets pulled, and how hard.
   Everything charged in this sim is charged the same way as the stick, so
   an object's own positive charge always slides toward the nearest strong
   charge and its negative charge slides away. */
function polarAxis(x, y, skip) {
  let ux = 0, uy = 0, best = 0;
  function look(cx, cy, q) {
    const dx = cx - x, dy = cy - y;
    const r2 = Math.max(dx * dx + dy * dy, 900);
    const w = q / r2;
    if (w > best) { best = w; const r = Math.sqrt(r2); ux = dx / r; uy = dy / r; }
  }
  const sq = stickCharge();
  if (sq > 0) look(stick.x, stick.y, 2.2 * sq);
  for (const f of flyers) if (f !== skip && f.q > 0.05) look(f.x, f.y, f.q);
  return { x: ux, y: uy, s: Math.min(1, best * 14000) };
}

/* charge sitting on the charging tip */
function drawStickCharge(x, y) {
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI + i * Math.PI / 4;
    const px = x + Math.cos(a) * 30, py = y + Math.sin(a) * 26;
    if (MODEL === 'one') { essence(px, py, 12); continue; }
    if (MODEL === 'two') { sign(px, py, false, 4.6); continue; }
    ctx.strokeStyle = '#2b6fd0'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px - 4, py); ctx.lineTo(px + 4, py);
    ctx.moveTo(px, py - 4); ctx.lineTo(px, py + 4);
    ctx.stroke();
  }
}

/* Charge marks for a flyer. The caller has already moved and turned the
   canvas, so these are in the flyer's own frame. */
function drawFlyerCharge(f, A, B, op) {
  if (!CFG.charges) return;
  const sx = Math.max(7.5, A * 1.15), sy = B * 0.80;

  if (MODEL === 'one') {
    if (f.q <= 0.05) return;
    const pts = scatter(Math.max(1, Math.round(f.q * 6)), f.seed);
    for (const p of pts) essence(p[0] * sx, p[1] * sy, 9);
    return;
  }

  if (MODEL === 'two') {
    /* Both kinds are always there. A neutral flyer holds equal amounts, a
       charged one has a surplus of red, and a charge nearby slides the two
       kinds to opposite ends. */
    /* a sagged flyer is a narrow sliver, so it gets fewer marks than an
       open one, or they would land on top of each other */
    const base = 2 + Math.round(2 * op);
    const extra = Math.round(f.q * 3);
    const ax = polarAxis(f.x, f.y, f);
    const c = Math.cos(f.rot), s = Math.sin(f.rot);
    const wx = ax.x * ax.s * sx * 0.85, wy = ax.y * ax.s * sy * 0.72;
    const lx = wx * c + wy * s, ly = -wx * s + wy * c;
    for (const p of scatter(base, f.seed))
      sign(p[0] * sx + lx, p[1] * sy + ly, true, 4.3);
    for (const p of scatter(base + extra, f.seed + 91))
      sign(p[0] * sx - lx, p[1] * sy - ly, false, 4.3);
    return;
  }

  if (f.q <= 0.05) return;
  ctx.strokeStyle = '#2b6fd0'; ctx.lineWidth = 2;
  for (const t of [0.5, 2.2, 3.9, 5.5]) {
    const px = A * Math.sin(2 * t) * 1.35, py = B * Math.cos(t) * 1.1;
    ctx.beginPath();
    ctx.moveTo(px - 4, py); ctx.lineTo(px + 4, py);
    ctx.moveTo(px, py - 4); ctx.lineTo(px, py + 4);
    ctx.stroke();
  }
}

/* A bit of paper is neutral the whole time. In the two-charge picture you
   can watch its own charge slide apart when the stick comes near, which is
   why a neutral scrap gets pulled in at all. */
function drawPaperCharge(p) {
  if (!CFG.charges || MODEL !== 'two') return;
  const c = Math.cos(p.rot), s = Math.sin(p.rot);
  const ax = polarAxis(p.x, p.y, null);
  let vx = c, vy = s;
  if (ax.s > 0.02) {
    vx = c * (1 - ax.s) + ax.x * ax.s;
    vy = s * (1 - ax.s) + ax.y * ax.s;
  }
  /* Neutral and far from anything, the two kinds sit together in the
     middle. Near the stick they slide to opposite ends. */
  const sep = (2.3 + 2.9 * ax.s) / (Math.hypot(vx, vy) || 1);
  vx *= sep; vy *= sep;
  const lx = vx * c + vy * s, ly = -vx * s + vy * c;
  sign(lx, ly, true, 3.0);
  sign(-lx, -ly, false, 3.0);
}

function drawFlows() {
  for (const fl of flows) {
    if (fl.t < 0) continue;
    const u = Math.min(1, fl.t / fl.dur);
    const bow = Math.sin(Math.PI * u);
    essence(fl.x0 + (fl.x1 - fl.x0) * u + fl.ax * bow,
            fl.y0 + (fl.y1 - fl.y0) * u + fl.ay * bow,
            8, 0.35 + 0.65 * bow);
  }
}

function drawFloor() {
  const g = ctx.createLinearGradient(0, FLOOR, 0, FLOOR + 26);
  g.addColorStop(0, 'rgba(0,0,0,0.055)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, FLOOR, W, 26);
  ctx.strokeStyle = '#cfcfcf'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, FLOOR); ctx.lineTo(W, FLOOR); ctx.stroke();
}

function drawStick() {
  const sq = stickCharge();
  const x = stick.x, y = stick.y;

  if (sq > 0) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, 78);
    g.addColorStop(0, 'rgba(90,160,255,0.30)');
    g.addColorStop(1, 'rgba(90,160,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 78, 0, 7); ctx.fill();
  }

  ctx.save();
  ctx.translate(x, y);

  /* soft shadow under the wand */
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  roundRect(-HW + 3, 3, HW * 2, WAND_LEN, HW); ctx.fill();
  ctx.restore();

  /* ── the painted tube ── */
  ctx.save();
  roundRect(-HW, 0, HW * 2, WAND_LEN, HW);
  ctx.clip();

  /* pale printed nose with the logo */
  ctx.fillStyle = '#ddf0fb'; ctx.fillRect(-HW, 0, HW * 2, PALE_END);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.ellipse(-4 + (i % 2) * 8, 10 + i * 12, 5, 3.4, 0.5, 0, 7);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(120,190,225,0.5)';
  ctx.beginPath(); ctx.ellipse(0, 6, 7, 5, 0, 0, 7); ctx.fill();

  /* plain blue shaft */
  ctx.fillStyle = '#1f93c8'; ctx.fillRect(-HW, PALE_END, HW * 2, OR1_0 - PALE_END);
  /* orange collar */
  ctx.fillStyle = '#f2a01e'; ctx.fillRect(-HW, OR1_0, HW * 2, OR1_1 - OR1_0);
  /* striped teal grip */
  ctx.fillStyle = '#2fb2cf'; ctx.fillRect(-HW, OR1_1, HW * 2, TEAL_1 - OR1_1);
  ctx.fillStyle = '#2596b3';
  for (let s = OR1_1 + 3; s < TEAL_1; s += 13) ctx.fillRect(-HW, s, HW * 2, 6);
  /* second orange collar */
  ctx.fillStyle = '#f2a01e'; ctx.fillRect(-HW, TEAL_1, HW * 2, OR2_1 - TEAL_1);
  /* butt end */
  ctx.fillStyle = '#1b6fa8'; ctx.fillRect(-HW, OR2_1, HW * 2, WAND_LEN - OR2_1);

  /* yellow squiggles on the grip */
  ctx.strokeStyle = '#ffd84d'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const t = OR1_1 + 10 + i * 18;
    ctx.beginPath();
    ctx.moveTo(-6, t);
    ctx.bezierCurveTo(2, t + 3, -3, t + 8, 6, t + 10);
    ctx.stroke();
  }

  /* logo down the nose */
  ctx.save();
  ctx.translate(0, 36); ctx.rotate(-Math.PI / 2);
  ctx.font = 'bold italic 13px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
  ctx.strokeText('Fly-Stick', 0, 0);
  ctx.fillStyle = '#f2a01e';
  ctx.fillText('Fly-Stick', 0, 0);
  ctx.restore();

  /* gloss */
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  roundRect(-HW + 2, 4, 3.6, WAND_LEN - 10, 1.8); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.13)';
  roundRect(HW - 4.5, 4, 3.2, WAND_LEN - 10, 1.6); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(20,60,90,0.35)'; ctx.lineWidth = 1.3;
  roundRect(-HW, 0, HW * 2, WAND_LEN, HW); ctx.stroke();

  /* ── ribbed collar and the little flag, both stand proud of the tube ── */
  ctx.fillStyle = '#1f93c8';
  ctx.strokeStyle = 'rgba(20,60,90,0.35)'; ctx.lineWidth = 1.3;
  roundRect(-HW - 14, GUARD_0 - 2, 16, 26, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  roundRect(-HW - 11, GUARD_0 + 1, 4, 19, 2); ctx.fill();
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = '#1a7fb0';
    roundRect(-HW - 2.5, GUARD_0 + i * 6.5, (HW + 2.5) * 2, 4.4, 2.2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(20,60,90,0.3)'; ctx.lineWidth = 1;
    ctx.stroke();
  }

  /* ── rounded butt cap ── */
  ctx.fillStyle = '#1b6fa8';
  roundRect(-CAP_HW, CAP_0, CAP_HW * 2, CAP_1 - CAP_0, CAP_HW);
  ctx.fill();
  ctx.strokeStyle = 'rgba(20,60,90,0.4)'; ctx.lineWidth = 1.3; ctx.stroke();
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = '#14577f';
    roundRect(-CAP_HW, CAP_0 + 3 + i * 6, CAP_HW * 2, 3.4, 1.7); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  roundRect(-CAP_HW + 2.5, CAP_0 + 3, 3.4, 26, 1.7); ctx.fill();

  ctx.restore();

  if (CFG.charges && sq > 0) drawStickCharge(x, y);

  drawPowerButton();
}

function drawPowerButton() {
  const b = btnPos();
  const bx = b.x, by = b.y;
  const on = stick.on;
  const hot = hover === 'power';

  if (on) {
    const g = ctx.createRadialGradient(bx, by, 2, bx, by, 20);
    g.addColorStop(0, 'rgba(255,60,40,0.45)');
    g.addColorStop(1, 'rgba(255,60,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bx, by, 20, 0, 7); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(bx, by, hot ? 9 : 8.2, 0, 7);
  ctx.fillStyle = '#12506f'; ctx.fill();
  ctx.beginPath(); ctx.arc(bx, by, 6, 0, 7);
  ctx.fillStyle = on ? '#ff3b26' : '#b03226'; ctx.fill();
  ctx.beginPath(); ctx.arc(bx - 1.6, by - 1.8, 2.1, 0, 7);
  ctx.fillStyle = on ? 'rgba(255,220,210,0.95)' : 'rgba(255,255,255,0.35)'; ctx.fill();
}

/* the flyer is a twisted strip of metallized plastic, closed into a loop.
   charged, it springs open into a round cage; uncharged, it sags flat.   */
function drawFlyer(f) {
  ctx.save();
  ctx.translate(f.x, f.y); ctx.rotate(f.rot);
  const R = f.r;
  const op = (f.open === undefined) ? 1 : f.open;
  const A = R * 0.54 * (0.11 + 0.89 * op);
  const B = R * 0.98;
  const WMAX = R * 0.28 * (1 + 0.45 * (1 - op));

  if (f.q > 0.05) {
    const g = ctx.createRadialGradient(0, 0, R * 0.3, 0, 0, R * 1.5);
    g.addColorStop(0, 'rgba(90,160,255,0.22)');
    g.addColorStop(1, 'rgba(90,160,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R * 1.5, 0, 7); ctx.fill();
  }

  const N = 132, outer = [], inner = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N * Math.PI * 2;
    const cx = A * Math.sin(2 * t), cy = B * Math.cos(t);
    const tx = 2 * A * Math.cos(2 * t), ty = -B * Math.sin(t);
    const m = Math.hypot(tx, ty) || 1;
    const nx = -ty / m, ny = tx / m;
    const w = WMAX * (0.14 + 0.86 * Math.abs(Math.cos(1.5 * t)));
    outer.push([cx + nx * w, cy + ny * w]);
    inner.push([cx - nx * w, cy - ny * w]);
  }

  ctx.beginPath();
  ctx.moveTo(outer[0][0], outer[0][1]);
  for (let i = 1; i <= N; i++) ctx.lineTo(outer[i][0], outer[i][1]);
  for (let i = N; i >= 0; i--) ctx.lineTo(inner[i][0], inner[i][1]);
  ctx.closePath();

  const gw = Math.max(A * 1.3, R * 0.16);
  const g2 = ctx.createLinearGradient(-gw, -B, gw, B);
  g2.addColorStop(0.00, '#dfe7ed');
  g2.addColorStop(0.14, '#ffffff');
  g2.addColorStop(0.30, '#b4c3ce');
  g2.addColorStop(0.46, '#f6f9fb');
  g2.addColorStop(0.62, '#9fb0bd');
  g2.addColorStop(0.78, '#f2f6f9');
  g2.addColorStop(1.00, '#c2cdd6');
  ctx.fillStyle = g2; ctx.fill();
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#8fa1af'; ctx.lineWidth = 1.1; ctx.stroke();

  /* a couple of bright glints where the strip faces you */
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.55 * op).toFixed(2) + ')';
  ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (const t0 of [0.15, 2.25, 4.35]) {
    ctx.beginPath();
    for (let k = 0; k <= 8; k++) {
      const t = t0 + k * 0.05;
      const px = A * Math.sin(2 * t), py = B * Math.cos(t);
      if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.stroke();
  }

  drawFlyerCharge(f, A, B, op);
  ctx.restore();
}

function drawPaper(p) {
  ctx.save();
  ctx.translate(p.x, p.y); ctx.rotate(p.rot);
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#b4b4b4'; ctx.lineWidth = 1.5;
  roundRect(-9, -6.5, 18, 13, 1.5);
  ctx.fill(); ctx.stroke();
  drawPaperCharge(p);
  ctx.restore();
}

/* a metal spoon, bowl up. metal conducts, so the bare spoon carries
   charge away the moment it touches something. */
function spoonShape() {
  const BY = SPOON_BY, RX = SPOON_RX, RY = SPOON_RY;

  function metal(x0, x1) {
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0.00, '#a9b6c0');
    g.addColorStop(0.18, '#ffffff');
    g.addColorStop(0.42, '#c3cdd5');
    g.addColorStop(0.64, '#f5f8fa');
    g.addColorStop(0.86, '#9fadb8');
    g.addColorStop(1.00, '#d6dee4');
    return g;
  }

  ctx.save();
  ctx.lineJoin = 'round';

  /* handle, with a slight waist just under the bowl */
  ctx.beginPath();
  ctx.moveTo(-4.6, BY + RY - 5);
  ctx.bezierCurveTo(-7.2, 6, -9.2, 34, -8.2, 57);
  ctx.quadraticCurveTo(0, 66, 8.2, 57);
  ctx.bezierCurveTo(9.2, 34, 7.2, 6, 4.6, BY + RY - 5);
  ctx.closePath();
  ctx.fillStyle = metal(-9.5, 9.5); ctx.fill();
  ctx.strokeStyle = '#7d8c98'; ctx.lineWidth = 1.2; ctx.stroke();

  /* bowl */
  ctx.beginPath();
  ctx.ellipse(0, BY, RX, RY, 0, 0, 7);
  ctx.fillStyle = metal(-RX, RX); ctx.fill();
  ctx.strokeStyle = '#7d8c98'; ctx.lineWidth = 1.2; ctx.stroke();

  /* the hollow */
  const hg = ctx.createRadialGradient(-3.5, BY - 6, 2, 0, BY, RX);
  hg.addColorStop(0.00, '#ffffff');
  hg.addColorStop(0.55, '#ccd7de');
  hg.addColorStop(1.00, '#93a2ad');
  ctx.beginPath();
  ctx.ellipse(0, BY, RX - 3.6, RY - 4, 0, 0, 7);
  ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = 'rgba(120,140,155,0.55)'; ctx.lineWidth = 1; ctx.stroke();

  /* glints */
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.ellipse(-5, BY - 8, 3.6, 6.5, -0.4, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  roundRect(-3.8, 2, 2.6, 48, 1.3); ctx.fill();

  ctx.restore();
}

/* a clear plastic ruler. plastic doesn't conduct, so a spoon resting on
   it can't drain the stick. */
function rulerShape() {
  const L = RULER_L, D = RULER_W;
  ctx.save();

  ctx.fillStyle = 'rgba(126,206,236,0.55)';
  ctx.strokeStyle = 'rgba(38,118,150,0.7)'; ctx.lineWidth = 1.6;
  roundRect(-L / 2, -D / 2, L, D, 5);
  ctx.fill(); ctx.stroke();

  /* the bevelled reading edge */
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  roundRect(-L / 2 + 3.5, -D / 2 + 3, L - 7, 5, 2.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(-L / 2 + 3.5, -D / 2 + 10, L - 7, 7, 3); ctx.fill();

  /* ticks */
  ctx.strokeStyle = 'rgba(24,66,92,0.8)'; ctx.lineWidth = 1.1;
  ctx.lineCap = 'butt';
  for (let i = 0; i <= 30; i++) {
    const x = -L / 2 + 10 + i * (L - 20) / 30;
    const long = (i % 5 === 0);
    ctx.beginPath();
    ctx.moveTo(x, D / 2 - 2.5);
    ctx.lineTo(x, D / 2 - (long ? 11 : 6));
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(20,58,82,0.9)';
  ctx.font = 'bold 8px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 1; i <= 5; i++) {
    const x = -L / 2 + 10 + i * 5 * (L - 20) / 30;
    ctx.fillText(String(i * 5), x, D / 2 - 15.5);
  }
  ctx.font = 'bold 8px Arial';
  ctx.fillText('cm', -L / 2 + 10, D / 2 - 15.5);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  /* hanging hole at the far end */
  ctx.beginPath(); ctx.arc(L / 2 - 9, -D / 2 + 9, 3.2, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
  ctx.strokeStyle = 'rgba(38,118,150,0.6)'; ctx.lineWidth = 1; ctx.stroke();

  ctx.restore();
}

function drawHand() {
  if (!CFG.hand) return;
  /* when the ruler is picked up, the spoon sits on it */
  if (glove.worn && CFG.glove) {
    ctx.save();
    ctx.translate(glove.x, glove.y + 12);
    ctx.rotate(Math.PI / 2);
    rulerShape();
    ctx.restore();
  }
  ctx.save(); ctx.translate(hand.x, hand.y);
  spoonShape();
  ctx.restore();
}

function drawGlove() {
  if (!CFG.glove || glove.worn) return;
  ctx.save(); ctx.translate(glove.x, glove.y); ctx.rotate(-0.09);
  rulerShape();
  ctx.restore();
}

function drawSparks() {
  for (const s of sparks) {
    const a = Math.max(0, s.life / s.t);
    ctx.strokeStyle = 'rgba(47,128,237,' + (0.85 * a).toFixed(3) + ')';
    ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    for (const pts of s.segs) {
      ctx.beginPath();
      ctx.moveTo(s.x + pts[0][0], s.y + pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(s.x + pts[i][0], s.y + pts[i][1]);
      ctx.stroke();
    }
  }
}

function drawResetIcon() {
  if (!CFG.resetbtn) return;
  const hot = hover === 'reset';
  ctx.save();
  ctx.translate(RESET_X, RESET_Y);
  const a0 = -0.35 * Math.PI, a1 = 1.25 * Math.PI, R = 15;
  ctx.strokeStyle = hot ? '#4a4a4a' : '#a8b0b6';
  ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, R, a0, a1); ctx.stroke();

  const tx = R * Math.cos(a1), ty = R * Math.sin(a1);
  const th = Math.atan2(Math.cos(a1), -Math.sin(a1));
  ctx.beginPath();
  ctx.moveTo(tx + Math.cos(th + Math.PI - 0.5) * 10, ty + Math.sin(th + Math.PI - 0.5) * 10);
  ctx.lineTo(tx, ty);
  ctx.lineTo(tx + Math.cos(th + Math.PI + 0.5) * 10, ty + Math.sin(th + Math.PI + 0.5) * 10);
  ctx.stroke();
  ctx.restore();
}

function label(text, x, y) {
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = '#555555';
  ctx.fillText(text, x, y);
  ctx.textAlign = 'left';
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawFloor();
  drawStick();
  for (const p of papers) drawPaper(p);
  for (const f of flyers) drawFlyer(f);
  drawGlove();
  drawHand();
  drawFlows();
  drawSparks();

  if (CFG.labels) {
    for (const f of flyers) label('flyer', f.x, Math.min(H - 6, f.y + f.r + 20));
    if (papers.length) label('paper', papers[0].x, Math.min(H - 6, papers[0].y + 22));
  }
  drawResetIcon();
}

/* ─── pointer ──────────────────────────────────────────────────── */
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * DESIGN_W / r.width,
    y: (e.clientY - r.top)  * DESIGN_H / r.height
  };
}

function hitTest(x, y) {
  if (CFG.resetbtn && Math.hypot(x - RESET_X, y - RESET_Y) < RESET_R + 6)
    return { type: 'reset' };
  const b = btnPos();
  if (Math.hypot(x - b.x, y - b.y) < 15)
    return { type: 'power' };
  if (CFG.glove) {
    if (glove.worn) {
      if (Math.hypot(x - glove.x, y - glove.y) < 34) return { type: 'glove' };
    } else if (Math.abs(x - glove.x) < RULER_L / 2 + 4 &&
               Math.abs(y - glove.y) < RULER_W / 2 + 8) {
      return { type: 'glove' };
    }
  }
  if (CFG.hand && Math.abs(x - hand.x) < 26 && y > hand.y - 62 && y < hand.y + 70)
    return { type: 'hand' };
  for (let i = flyers.length - 1; i >= 0; i--)
    if (Math.hypot(x - flyers[i].x, y - flyers[i].y) < flyers[i].r + 6)
      return { type: 'flyer', o: flyers[i] };
  for (let i = papers.length - 1; i >= 0; i--)
    if (Math.abs(x - papers[i].x) < 17 && Math.abs(y - papers[i].y) < 15)
      return { type: 'paper', o: papers[i] };
  if (x > stick.x - 26 && x < stick.x + 20 && y > stick.y - 14 && y < stick.y + WAND_LEN + 6)
    return { type: 'stick' };
  return null;
}

function down(x, y) {
  const h = hitTest(x, y);
  if (!h) { drag = null; return; }
  if (h.type === 'reset') { reset(); return; }
  if (h.type === 'power') { stick.on = !stick.on; addSpark(stick.x, stick.y, 2); return; }

  if (h.type === 'glove') {
    glove.worn = false;
    drag = { type: 'glove', ox: glove.x - x, oy: glove.y - y };
  } else if (h.type === 'hand') {
    drag = { type: 'hand', ox: hand.x - x, oy: hand.y - y };
  } else if (h.type === 'stick') {
    drag = { type: 'stick', ox: stick.x - x, oy: stick.y - y };
  } else {
    h.o.held = true; h.o.stuck = null;
    drag = { type: h.type, o: h.o, ox: h.o.x - x, oy: h.o.y - y };
  }
  prev = { x: x, y: y, t: performance.now() };
  canvas.style.cursor = 'grabbing';
}

function move(x, y) {
  if (!drag) {
    const h = hitTest(x, y);
    hover = h ? h.type : null;
    canvas.style.cursor = !h ? 'default'
      : (h.type === 'reset' || h.type === 'power') ? 'pointer' : 'grab';
    return;
  }
  const nx = x + drag.ox, ny = y + drag.oy;
  if (drag.type === 'stick') {
    stick.x = Math.max(40, Math.min(W - 40, nx));
    stick.y = Math.max(60, Math.min(STICK_Y_MAX, ny));
  } else if (drag.type === 'hand') {
    hand.x = Math.max(50, Math.min(W - 50, nx));
    hand.y = Math.max(70, Math.min(H - 40, ny));
  } else if (drag.type === 'glove') {
    glove.x = Math.max(RULER_L / 2 + 10, Math.min(W - RULER_L / 2 - 10, nx));
    glove.y = Math.max(70, Math.min(H - 40, ny));
  } else {
    const o = drag.o;
    const now = performance.now();
    const dt = Math.max(0.012, (now - prev.t) / 1000);
    o.vx = Math.max(-1400, Math.min(1400, (nx - o.x) / dt * 0.55));
    o.vy = Math.max(-1400, Math.min(1400, (ny - o.y) / dt * 0.55));
    o.x = nx; o.y = ny;
    prev = { x: x, y: y, t: now };
  }
}

function up() {
  if (drag) {
    if (drag.o) drag.o.held = false;
    if (drag.type === 'glove' && CFG.hand &&
        Math.hypot(glove.x - hand.x, glove.y - hand.y) < 55) {
      glove.worn = true;
    }
  }
  drag = null;
  canvas.style.cursor = 'default';
}

canvas.addEventListener('mousedown', e => { const p = toLogical(e); down(p.x, p.y); });
window.addEventListener('mousemove', e => { const p = toLogical(e); move(p.x, p.y); });
window.addEventListener('mouseup', up);
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); const p = toLogical(e.touches[0]); down(p.x, p.y);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault(); const p = toLogical(e.touches[0]); move(p.x, p.y);
}, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); up(); }, { passive: false });
canvas.addEventListener('touchcancel', e => { e.preventDefault(); up(); }, { passive: false });

/* ─── run ──────────────────────────────────────────────────────── */
reset();
new ResizeObserver(fit).observe(canvas);
fit();

let last = 0;
function loop(ts) {
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  step(Math.min(dt, 1 / 30));
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>

<!-- CHEAT PANEL — visible only when ?cheat=1 is in the URL -->
<script>
(function () {
  var _cpQ = new URLSearchParams(location.search);
  if (_cpQ.get('cheat') !== '1') return;

  // ── CONFIGURE: one entry per exposed URL param ──────────────────────────
  var CHEAT_DEFS = [
    {name:'model',    type:'select', values:['none','one','two'],
                              default:(window.SIM_DEFAULT_MODEL||'none'),
                                                           desc:'Which picture of charge is drawn on top: none, one red charge stuff, or two kinds'},
    {name:'power',    type:'toggle',                              default:0,   desc:'Stick starts switched on'},
    {name:'flyers',   type:'number', min:0,   max:3,   step:1,    default:2,   desc:'How many flyers'},
    {name:'papers',   type:'number', min:0,   max:14,  step:1,    default:6,   desc:'How many bits of paper'},
    {name:'spoon',    type:'toggle',                              default:1,   desc:'Show the metal spoon'},
    {name:'ruler',    type:'toggle',                              default:1,   desc:'Show the plastic ruler'},
    {name:'labels',   type:'toggle',                              default:1,   desc:'Show the "flyer" / "paper" labels'},
    {name:'charges',  type:'toggle',
                              default:(window.SIM_DEFAULT_MODEL!=='none')?1:0,
                                                           desc:'Show the charge marks'},
    {name:'sparks',   type:'toggle',                              default:1,   desc:'Show sparks and crackle'},
    {name:'collapse', type:'toggle',                              default:1,   desc:'Flyer pops open when charged, collapses when not'},
    {name:'resetbtn', type:'toggle',                              default:1,   desc:'Show the start-over arrow'},
    {name:'gravity',  type:'number', min:0.2, max:3,   step:0.1,  default:1,   desc:'Gravity strength'},
    {name:'strength', type:'number', min:0.2, max:3,   step:0.1,  default:1,   desc:'How strongly the stick charges'}
  ];
  var EMBED_KEYS = ['cheat']; // keys stripped from the embeddable URL
  // ────────────────────────────────────────────────────────────────────────

  function buildCleanUrl(ov) {
    var p = new URLSearchParams(location.search);
    EMBED_KEYS.forEach(function(k) { p.delete(k); });
    for (var k in ov) { var v=ov[k]; if(v===null||v==='') p.delete(k); else p.set(k,v); }
    var qs = p.toString();
    return location.origin + location.pathname + (qs ? '?' + qs : '');
  }
  function buildCheatUrl(ov) {
    var b = buildCleanUrl(ov);
    return b + (b.indexOf('?') >= 0 ? '&' : '?') + 'cheat=1';
  }
  function getEff(d) { var r=_cpQ.get(d.name); return r===null ? String(d.default??'') : r; }
  function isTruthy(v) { return v!=='0'&&v!=='false'&&v!=='no'&&v!=='off'&&v!==''; }

  function makeControl(d) {
    var eff = getEff(d);
    if (d.type === 'toggle') {
      var on = isTruthy(eff), btn = document.createElement('button');
      btn.textContent = on ? '1 (on)' : '0 (off)';
      btn.style.cssText = 'background:'+(on?'#1b3d1b':'#3d1b1b')+';color:'+(on?'#6dca80':'#e07070')+
        ';border:1px solid '+(on?'#2a7a3a':'#8a2a2a')+';border-radius:3px;padding:3px 10px;'+
        'cursor:pointer;font-size:12px;min-width:70px';
      btn.onclick = function() { var u={}; u[d.name]=on?'0':'1'; location.href=buildCheatUrl(u); };
      return btn;
    }
    if (d.type === 'select') {
      var sel = document.createElement('select');
      sel.style.cssText = 'background:#0d1b2a;color:#c8d8e8;border:1px solid #2a3f5f;'+
        'border-radius:3px;padding:3px 8px;font-size:12px;cursor:pointer';
      d.values.forEach(function(v) {
        var o = document.createElement('option'); o.value=v; o.textContent=v;
        if (eff===String(v)) o.selected=true; sel.appendChild(o);
      });
      sel.onchange = function() { var u={}; u[d.name]=sel.value; location.href=buildCheatUrl(u); };
      return sel;
    }
    var inp = document.createElement('input');
    inp.type = d.type==='number' ? 'number' : 'text'; inp.value = eff;
    if (d.min!==undefined) inp.min=String(d.min);
    if (d.max!==undefined) inp.max=String(d.max);
    if (d.step!==undefined) inp.step=String(d.step);
    inp.style.cssText = 'background:#0d1b2a;color:#c8d8e8;border:1px solid #2a3f5f;'+
      'border-radius:3px;padding:3px 6px;width:'+(d.type==='number'?'90':'220')+'px;font-size:12px';
    inp.onchange = function() { var u={}; u[d.name]=inp.value; location.href=buildCheatUrl(u); };
    return inp;
  }

  function typeLabel(d) {
    if (d.type==='toggle') return '0|1';
    if (d.type==='select') return d.values.join('|');
    if (d.type==='number'&&d.min!==undefined&&d.max!==undefined) return d.min+'–'+d.max;
    return d.type;
  }

  function render() {
    var panel = document.createElement('div');
    panel.style.cssText = 'position:fixed;bottom:0;left:0;right:0;'+
      'background:rgba(12,18,32,0.97);color:#c8d8e8;'+
      'font-family:"Segoe UI",system-ui,monospace;font-size:13px;'+
      'border-top:2px solid #3a7bd5;z-index:2147483647;max-height:48vh;overflow-y:auto;'+
      'padding:10px 16px 14px;box-sizing:border-box;box-shadow:0 -4px 24px rgba(0,0,0,0.6)';

    var hdr = document.createElement('div');
    hdr.style.cssText = 'font-weight:bold;color:#7ab8f5;margin-bottom:8px;'+
      'display:flex;align-items:center;justify-content:space-between';
    var hspan = document.createElement('span');
    hspan.textContent = '🔑 Cheat Panel — ' + location.pathname.split('/').pop();
    var xbtn = document.createElement('button');
    xbtn.textContent = '×'; xbtn.title = 'Close (reload to restore)';
    xbtn.style.cssText = 'background:none;border:none;color:#7ab8f5;font-size:18px;'+
      'cursor:pointer;padding:0 4px;line-height:1';
    xbtn.onclick = function() { panel.remove(); };
    hdr.appendChild(hspan); hdr.appendChild(xbtn); panel.appendChild(hdr);

    var tbl = document.createElement('table');
    tbl.style.cssText = 'border-collapse:collapse;width:100%;margin-bottom:10px';
    var hrow = tbl.createTHead().insertRow();
    ['Parameter','Type/Values','Control','Description'].forEach(function(h) {
      var th = document.createElement('th');
      th.textContent = h;
      th.style.cssText = 'text-align:left;padding:4px 10px;border-bottom:1px solid #1e3050;'+
        'color:#5a8fc0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap';
      hrow.appendChild(th);
    });
    var tbody = tbl.createTBody();
    CHEAT_DEFS.forEach(function(d) {
      var row = tbody.insertRow(), isSet = _cpQ.has(d.name);
      row.style.cssText = 'border-bottom:1px solid #131f30;'+
        (isSet ? 'background:rgba(58,123,213,0.08)' : '');
      var nc = row.insertCell();
      nc.style.cssText = 'padding:5px 10px;font-weight:bold;font-size:12px;'+
        'color:'+(isSet?'#a8d4ff':'#7fa8d0')+';white-space:nowrap;font-family:monospace';
      nc.textContent = d.name;
      var tc = row.insertCell();
      tc.style.cssText = 'padding:5px 10px;color:#5a7a90;font-size:11px;font-family:monospace';
      tc.textContent = typeLabel(d);
      var cc = row.insertCell();
      cc.style.cssText = 'padding:4px 10px;white-space:nowrap';
      cc.appendChild(makeControl(d));
      var dc = row.insertCell();
      dc.style.cssText = 'padding:5px 10px;color:#8aa0b0;font-size:12px';
      dc.textContent = (d.desc||'')+(d.default!==undefined?' (default: '+d.default+')':'');
    });
    panel.appendChild(tbl);

    var urlBox = document.createElement('div');
    urlBox.style.cssText = 'background:#080d1a;border:1px solid #1e3050;border-radius:4px;'+
      'padding:7px 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap';
    var ulbl = document.createElement('span');
    ulbl.style.cssText = 'color:#5a8fc0;font-size:11px;text-transform:uppercase;'+
      'letter-spacing:.06em;white-space:nowrap;flex-shrink:0';
    ulbl.textContent = 'Embed URL:';
    var ulink = document.createElement('a');
    ulink.style.cssText = 'color:#5fba7d;word-break:break-all;font-size:12px;'+
      'font-family:monospace;text-decoration:none';
    ulink.href = buildCleanUrl({}); ulink.textContent = buildCleanUrl({});
    ulink.onclick = function(e) { e.preventDefault(); location.href=buildCheatUrl({}); };
    var cpybtn = document.createElement('button');
    cpybtn.textContent = 'copy';
    cpybtn.style.cssText = 'background:#1a3050;color:#7ab8f5;border:1px solid #2a4a70;'+
      'border-radius:3px;padding:2px 8px;font-size:11px;cursor:pointer;'+
      'white-space:nowrap;flex-shrink:0;margin-left:4px';
    cpybtn.onclick = function() {
      navigator.clipboard && navigator.clipboard.writeText(buildCleanUrl({}));
      cpybtn.textContent = '✓ copied';
      setTimeout(function() { cpybtn.textContent = 'copy'; }, 1500);
    };
    urlBox.appendChild(ulbl); urlBox.appendChild(ulink); urlBox.appendChild(cpybtn);
    panel.appendChild(urlBox);
    document.body.appendChild(panel);
  }
  render();
})();
</script>
</body>
</html>
