<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Position vs. Time Fit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }
  body {
    width: min(600px, 100vw);
    height: min(500px, calc(100vw * 500 / 600));
    max-height: 100vh;
    margin: 0 auto;
    font-family: 'Segoe UI', Arial, sans-serif;
    position: relative;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6px 12px 8px;
    gap: 5px;
    background: linear-gradient(transparent, rgba(255, 255, 255, 0.94));
    border-top: 1px solid rgba(0, 0, 0, 0.06);
    pointer-events: none;
  }
  #overlay > * { pointer-events: auto; }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row label {
    color: #333;
    font-size: 11px;
    white-space: nowrap;
    width: 72px;
    flex-shrink: 0;
  }
  .row input[type="range"] {
    flex: 1;
    accent-color: #c0392b;
    min-width: 0;
  }
  .row .val {
    color: #222;
    font-size: 11px;
    font-weight: 600;
    width: 48px;
    text-align: right;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="overlay">
  <div class="row">
    <label for="coefSlider">Coefficient</label>
    <input type="range" id="coefSlider" min="0" max="3" value="0.50" step="0.01">
    <span class="val" id="coefVal">0.50</span>
  </div>
  <div class="row">
    <!-- The exponent slider moves through slot numbers 0..4.
         The script translates each slot into an exponent (-2, -1, 0, 1, 2). -->
    <label for="powerSlider">Exponent</label>
    <input type="range" id="powerSlider" min="0" max="4" value="3" step="1">
    <span class="val" id="powerVal">1</span>
  </div>
</div>

<script>
(function () {
'use strict';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

//------ PAGE SIZE (same as wave_speed_fit) -----------------
const LOGICAL_W = 600;
const LOGICAL_H = 500;
const CTRL_H = 56;          // height of the slider strip at the bottom

//------ AXES (copied from the Asymptote template) ----------
const XMIN = 0, XMAX = 6;
const YMIN = 0, YMAX = 11;
const X_TICK = 1, X_SUBTICK = 0.5;
const Y_TICK = 1, Y_SUBTICK = 0.5;

const X_LABEL = 'Time (s)';
const Y_LABEL = 'Position (m)';

//------ DATA POINTS (copied from the Asymptote template) ---
const XDATA = [0.7, 1.4, 2.1, 2.8, 3.5];
const YDATA = [0.2, 0.8, 1.8, 3.2, 5];

// Space (in pixels) between the plot frame and the canvas edges.
const PAD = {
  left: 58,
  right: 14,
  top: 34,
  bottom: 36,
};

//------ EXPONENT CHOICES -----------------------------------
// Each entry is one notch on the exponent slider.
// "label" is what appears next to the slider (uses a true minus sign).
// "sup" is the superscript used in the equation at the top of the graph.
const POWER_STOPS = [
  { value: -2, label: '−2', sup: '⁻²' },
  { value: -1, label: '−1', sup: '⁻¹' },
  { value:  0, label: '0',  sup: ''   },
  { value:  1, label: '1',  sup: ''   },
  { value:  2, label: '2',  sup: '²'  },
];

const DEFAULT_POWER_INDEX = POWER_STOPS.findIndex(s => s.value === 1);

let W = LOGICAL_W;
let H = LOGICAL_H;
let dpr = 1;

// Current slider settings
let coefA = 0.50;
let powerIndex = DEFAULT_POWER_INDEX;

const coefSlider = document.getElementById('coefSlider');
const powerSlider = document.getElementById('powerSlider');
const coefVal = document.getElementById('coefVal');
const powerVal = document.getElementById('powerVal');

function powerP() {
  return POWER_STOPS[powerIndex].value;
}

// Round to 2 decimals and drop trailing zeros (0.50 -> "0.5")
function formatNum(n) {
  return (+n.toFixed(2)).toString();
}

//------ EQUATION TEXT --------------------------------------
function equationText() {
  const a = formatNum(coefA);
  const stop = POWER_STOPS[powerIndex];
  if (stop.value === 0) return `position = ${a}`;   // (time)^0 = 1, so position is constant
  return `position = ${a} × (time)${stop.sup}`;
}

function drawEquation() {
  const r = plotRect();
  const text = equationText();
  ctx.font = '13px Segoe UI, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const tw = ctx.measureText(text).width;
  const cx = r.left + r.width / 2;
  const cy = r.top - 14;

  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - tw / 2 - 6, cy - 9, tw + 12, 18);
  ctx.fillStyle = '#000';
  ctx.fillText(text, cx, cy);
}

//------ THE MODEL CURVE: x = a * t^p -----------------------
function curve(t) {
  const p = powerP();
  // Negative exponents divide by t, which is undefined at t = 0.
  // Returning NaN ("not a number") tells drawCurve to skip this point.
  if (t <= 0 && p < 0) return NaN;
  return coefA * Math.pow(t, p);   // note: Math.pow(0, 0) is 1, so p = 0 gives x = a
}

//------ COORDINATE CONVERSION ------------------------------
// The rectangle (in pixels) where the graph itself is drawn.
function plotRect() {
  const top = PAD.top;
  const left = PAD.left;
  const right = W - PAD.right;
  const bottom = H - CTRL_H - PAD.bottom;
  return { left, top, right, bottom, width: right - left, height: bottom - top };
}

// Convert a physics point (t in s, x in m) into canvas pixels.
// Canvas y grows downward, so the vertical formula is flipped.
function dataToCanvas(x, y) {
  const r = plotRect();
  return {
    x: r.left + (x - XMIN) / (XMAX - XMIN) * r.width,
    y: r.top + (YMAX - y) / (YMAX - YMIN) * r.height,
  };
}

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width || LOGICAL_W;
  H = rect.height || LOGICAL_H;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

//------ GRID -----------------------------------------------
function drawGrid(xStep, yStep, color) {
  const r = plotRect();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;

  for (let x = XMIN; x <= XMAX + 1e-9; x += xStep) {
    const p = dataToCanvas(x, YMIN);
    ctx.beginPath();
    ctx.moveTo(p.x, r.top);
    ctx.lineTo(p.x, r.bottom);
    ctx.stroke();
  }

  for (let y = YMIN; y <= YMAX + 1e-9; y += yStep) {
    const p = dataToCanvas(XMIN, y);
    ctx.beginPath();
    ctx.moveTo(r.left, p.y);
    ctx.lineTo(r.right, p.y);
    ctx.stroke();
  }
}

//------ TICK MARKS AND NUMBERS -----------------------------
function drawTicks() {
  const r = plotRect();
  const tickMajor = 6;
  const tickMinor = 3;

  ctx.strokeStyle = '#000';
  ctx.fillStyle = '#000';
  ctx.lineWidth = 1;
  ctx.font = '12px Segoe UI, Arial, sans-serif';
  ctx.textBaseline = 'middle';

  // Horizontal axis: ticks on bottom and top, numbers below the bottom
  for (let x = XMIN; x <= XMAX + 1e-9; x += X_SUBTICK) {
    const p = dataToCanvas(x, YMIN);
    const major = Math.abs(x / X_TICK - Math.round(x / X_TICK)) < 1e-9;
    const len = major ? tickMajor : tickMinor;

    ctx.beginPath();
    ctx.moveTo(p.x, r.bottom);
    ctx.lineTo(p.x, r.bottom + len);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.x, r.top);
    ctx.lineTo(p.x, r.top - len);
    ctx.stroke();

    if (major) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillRect(p.x - 14, r.bottom + len + 2, 28, 14);
      ctx.fillStyle = '#000';
      ctx.fillText(String(Math.round(x)), p.x, r.bottom + len + 10);
    }
  }

  // Vertical axis: ticks on left and right, numbers to the left
  for (let y = YMIN; y <= YMAX + 1e-9; y += Y_SUBTICK) {
    const p = dataToCanvas(XMIN, y);
    const major = Math.abs(y / Y_TICK - Math.round(y / Y_TICK)) < 1e-9;
    const len = major ? tickMajor : tickMinor;

    ctx.beginPath();
    ctx.moveTo(r.right, p.y);
    ctx.lineTo(r.right + len, p.y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(r.left, p.y);
    ctx.lineTo(r.left - len, p.y);
    ctx.stroke();

    if (major) {
      const tx = r.left - len - 4;     // right edge of the number
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.fillRect(tx - 16, p.y - 7, 18, 14);
      ctx.fillStyle = '#000';
      ctx.fillText(String(Math.round(y)), tx, p.y);
    }
  }
}

function drawAxes() {
  const r = plotRect();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.strokeRect(r.left, r.top, r.width, r.height);
}

function drawAxisLabels() {
  const r = plotRect();
  ctx.font = '12px Segoe UI, Arial, sans-serif';

  // Horizontal axis label
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff';
  ctx.fillRect(r.left + r.width / 2 - 70, r.bottom + 24, 140, 16);
  ctx.fillStyle = '#000';
  ctx.fillText(X_LABEL, r.left + r.width / 2, r.bottom + 26);

  // Vertical axis label (rotated 90° counterclockwise)
  ctx.save();
  ctx.translate(r.left - 44, r.top + r.height / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff';
  ctx.fillRect(-60, -2, 120, 16);
  ctx.fillStyle = '#000';
  ctx.fillText(Y_LABEL, 0, 0);
  ctx.restore();
}

//------ RED DASHED MODEL CURVE -----------------------------
function drawCurve() {
  const r = plotRect();
  ctx.save();
  // Clip: anything drawn outside the plot frame is hidden
  ctx.beginPath();
  ctx.rect(r.left, r.top, r.width, r.height);
  ctx.clip();

  ctx.strokeStyle = 'red';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();

  // For negative exponents the curve shoots toward infinity near t = 0.
  // Clamp very large values so the canvas never receives absurd coordinates;
  // the clipped-away part is invisible anyway.
  const yLimit = 10 * (YMAX - YMIN);

  const steps = Math.max(400, Math.round(r.width * 2));
  let started = false;
  for (let i = 0; i <= steps; i++) {
    const x = XMIN + (XMAX - XMIN) * i / steps;
    let y = curve(x);
    if (!Number.isFinite(y)) { started = false; continue; }
    y = Math.min(Math.max(y, YMIN - yLimit), YMAX + yLimit);
    const p = dataToCanvas(x, y);
    if (!started) {
      ctx.moveTo(p.x, p.y);
      started = true;
    } else {
      ctx.lineTo(p.x, p.y);
    }
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

//------ BLUE DATA POINTS -----------------------------------
function drawPoints() {
  const dotR = 5;
  ctx.fillStyle = 'blue';
  for (let i = 0; i < XDATA.length; i++) {
    const p = dataToCanvas(XDATA[i], YDATA[i]);
    ctx.beginPath();
    ctx.arc(p.x, p.y, dotR, 0, Math.PI * 2);
    ctx.fill();
  }
}

//------ REDRAW EVERYTHING (called after every change) ------
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  drawGrid(X_SUBTICK, Y_SUBTICK, '#d3d3d3');
  drawGrid(X_TICK, Y_TICK, '#808080');
  drawAxes();
  drawTicks();
  drawAxisLabels();
  drawEquation();
  drawCurve();
  drawPoints();
}

//------ SLIDERS --------------------------------------------
function bindControls() {
  coefSlider.addEventListener('input', () => {
    coefA = +coefSlider.value;
    coefVal.textContent = coefA.toFixed(2);
    draw();
  });
  powerSlider.addEventListener('input', () => {
    powerIndex = +powerSlider.value;
    powerVal.textContent = POWER_STOPS[powerIndex].label;
    draw();
  });
}

bindControls();
powerSlider.max = POWER_STOPS.length - 1;
powerSlider.value = DEFAULT_POWER_INDEX;
powerVal.textContent = POWER_STOPS[DEFAULT_POWER_INDEX].label;
window.addEventListener('resize', resizeCanvas);
if (window.ResizeObserver) {
  new ResizeObserver(resizeCanvas).observe(canvas);
}
resizeCanvas();
})();
</script>
</body>
</html>
